[Retry]
Enabled=1

; ---------- Text (displayed in the middle of the pause screen, using the options font) ----------
; Use only basic letters (accented characters are converted to unaccented letters).
Message=Retry?
YesText=Yes
NoText=No

; ---------- Colors (hexadecimal RRGGBB) ----------
; Title, selected option, and unselected option.
TitleColor=B8C8EE
SelectedColor=D2E0FF
NormalColor=6E7F9C

; ---------- How to choose ----------
; Keyboard: Up/Down arrows to choose and Enter to confirm.
; Mouse: hover over the option and click.
; Controller (XInput or GInput): D-pad or LEFT analog stick Up/Down to choose and Cross (A) to confirm.
; Esc and the controller Y button (Triangle) cancel (No).
; Sounds: navigation, confirm (Yes), and back (No, Esc, Y) use the same sound effects as the game's pause menu.
; No shortcuts (R, N, left/right directional): only navigation and confirmation.

; 1 = the Esc key cancels.
CancelOnEscape=1

; Controller back button (Triangle = Y on Xbox): cancels, like in the game menu. NONE disables it.
BackPadButton=Triangle

; Where to read controller input from:
;   Auto   = reads XInput directly (Xbox/XInput controller) and, if unavailable, uses the game's pad (GInput)
;   XInput = XInput only (ignores any other button or key)
;   Game   = game's pad only (ignored while any keyboard key is being pressed)
PadSource=Auto

; ---------- Position and size ----------
; Vertical position of the top of the "Yes" line (% of screen height; 47 places the Retry?/Yes/No block in the middle).
MessageY=47
MessageOffsetX=0
MessageOffsetY=0

