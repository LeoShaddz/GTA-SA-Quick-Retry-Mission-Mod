[Retry]
Enabled=1

; ---------- Textos (aparecem no meio da tela de pausa, com a fonte das opcoes) ----------
; Use apenas letras simples (acentos viram letras sem acento).
Message=Retry?
YesText=Yes
NoText=No

; ---------- Cores (hexadecimal RRGGBB) ----------
; Titulo, opcao selecionada e opcao nao selecionada.
TitleColor=B8C8EE
SelectedColor=D2E0FF
NormalColor=6E7F9C

; ---------- Como escolher ----------
; Teclado: setas Cima/Baixo para escolher e Enter para confirmar.
; Mouse: passe o cursor sobre a opcao e clique.
; Controle (XInput ou GInput): direcional ou analogico ESQUERDO Cima/Baixo para escolher e Cross (A) para confirmar.
; Esc e o botao Y do controle (Triangle) cancelam (No).
; Sons: navegar, confirmar (Yes) e voltar (No, Esc, Y) usam os mesmos efeitos sonoros do menu de pausa do jogo.
; Nao ha atalhos (R, N, direcional esquerdo/direito): so navegar e confirmar.

; 1 = a tecla Esc cancela.
CancelOnEscape=1

; Botao de voltar do controle (Triangle = Y no Xbox): cancela, como no menu do jogo. NONE desativa.
BackPadButton=Triangle

; De onde ler o controle:
;   Auto   = le o XInput direto (controle Xbox/XInput) e, se nao houver, usa o pad do jogo (GInput)
;   XInput = so XInput (ignora qualquer outro botao ou tecla)
;   Game   = so o pad do jogo (ignorado enquanto houver qualquer tecla do teclado apertada)
PadSource=Auto

; ---------- Posicao e tamanho ----------
; Posicao vertical do topo da linha "Yes" (% da altura da tela; 47 deixa o bloco Retry?/Yes/No no meio).
MessageY=47
MessageOffsetX=0
MessageOffsetY=0

; Multiplicador do tamanho do texto (1.0 = mesmo tamanho das opcoes do menu).
TextScale=1.0

; Espacamento entre as linhas (1.0 = mesmo espacamento do menu de pausa).
LineSpacing=1.0

; 1 = mostra o cursor do mouse (o icone original do jogo, carregado dos arquivos do jogo).
ShowMouseCursor=1

; 1 = como no GInput: o cursor some quando voce usa o controle ou as setas do teclado e volta quando voce mexe no mouse.
; 0 = o cursor fica sempre visivel.
HideCursorWithController=1

; ---------- O que e restaurado ao recomecar ----------
; Tudo isso volta ao estado de quando voce pisou no marcador e a missao comecou.
; 1 = restaura, 0 = nao restaura.

; Armas e municao exata (total e no pente), alem da arma na mao
RestoreWeapons=1
; Saude exata
RestoreHealth=1
; Colete exato
RestoreArmour=1
; Dinheiro que voce tinha
RestoreMoney=1
; Nivel de procurado (se voce estava sem, volta a zero)
RestoreWanted=1
; Hora do jogo e clima
RestoreTimeWeather=1
